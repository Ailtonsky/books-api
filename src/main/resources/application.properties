spring.application.name=books-api
spring.config.import=optional:file:.env[.properties]
# --- Base de datos (mismas variables que docker-compose) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/bookhub}
spring.datasource.username=${DB_USERNAME:bookhub_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Paginacion ---
spring.data.web.pageable.max-page-size=50

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}

# --- Usuarios iniciales (DataInitializer) ---
app.init.admin.username=${ADMIN_USERNAME}
app.init.admin.email=${ADMIN_EMAIL}
app.init.admin.password=${ADMIN_PASSWORD}
app.init.user.username=${USER_USERNAME}
app.init.user.email=${USER_EMAIL}
app.init.user.password=${USER_PASSWORD}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}